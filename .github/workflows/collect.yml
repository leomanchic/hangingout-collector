name: Collect Moscow events
run-name: Collect ${{ inputs.source || 'all' }}${{ inputs.schedule_key != '' && format(' primary {0}', inputs.schedule_key) || inputs.recovery_key != '' && format(' recovery {0}', inputs.recovery_key) || '' }}

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Source to collect
        type: choice
        default: all
        options: [all, kudago, yandex]
      kudago_limit:
        description: Maximum KudaGO cards (20 for a quick diagnostic, 300 normally)
        type: string
        default: '300'
      recovery_key:
        description: Recovery attempt identifier (set by the REG.RU monitor)
        type: string
        default: ''
      schedule_key:
        description: Hourly slot identifier (set by the REG.RU scheduler)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  collect:
    if: github.repository == 'leomanchic/hangingout-collector'
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(inputs.source == 'kudago' && '["kudago"]' || inputs.source == 'yandex' && '["yandex"]' || '["kudago","yandex"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: collect-${{ matrix.source }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install collector
        run: python -m pip install -r requirements.txt
      - name: Check collector contracts
        run: python -m unittest discover -s tests
      - name: Install Chromium
        if: github.event_name == 'schedule' || inputs.source == 'all' || inputs.source == matrix.source
        run: python -m playwright install --with-deps chromium
      - name: Collect and publish
        if: github.event_name == 'schedule' || inputs.source == 'all' || inputs.source == matrix.source
        env:
          COLLECTOR_SECRET: ${{ secrets.COLLECTOR_SECRET }}
          COLLECTOR_SOURCE: ${{ matrix.source }}
          KUDAGO_LIMIT: ${{ inputs.kudago_limit || '300' }}
          COLLECTOR_RECOVERY_KEY: ${{ inputs.recovery_key }}
          COLLECTOR_SCHEDULE_KEY: ${{ inputs.schedule_key }}
        run: python run_collector.py
      - name: Save KudaGO skipped-card diagnostics
        if: always() && matrix.source == 'kudago'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kudago-skips-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/kudago-skips.json
          if-no-files-found: ignore
          retention-days: 30

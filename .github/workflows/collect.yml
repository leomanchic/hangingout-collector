name: Collect Moscow events

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Source to collect
        type: choice
        default: all
        options: [all, kudago, yandex]
      kudago_limit:
        description: Maximum KudaGO cards (20 for a quick diagnostic, 300 normally)
        type: string
        default: '300'

permissions:
  contents: read

jobs:
  collect:
    if: github.repository == 'leomanchic/hangingout-collector'
    strategy:
      fail-fast: false
      matrix:
        source: [kudago, yandex]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: collect-${{ matrix.source }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install collector
        run: python -m pip install -r requirements.txt
      - name: Check collector contracts
        run: python -m unittest discover -s tests
      - name: Install Chromium
        if: github.event_name == 'schedule' || inputs.source == 'all' || inputs.source == matrix.source
        run: python -m playwright install --with-deps chromium
      - name: Collect and publish
        if: github.event_name == 'schedule' || inputs.source == 'all' || inputs.source == matrix.source
        env:
          COLLECTOR_SECRET: ${{ secrets.COLLECTOR_SECRET }}
          COLLECTOR_SOURCE: ${{ matrix.source }}
          KUDAGO_LIMIT: ${{ inputs.kudago_limit || '300' }}
        run: python run_collector.py

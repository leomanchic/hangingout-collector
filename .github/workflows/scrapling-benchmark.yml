name: Full collector comparison
on:
  workflow_dispatch:
    inputs:
      source:
        description: Source to compare without publication
        type: choice
        default: all
        options: [all, kudago, yandex]
      rounds:
        description: Paired rounds with reversed order (1 or 2)
        type: choice
        default: '2'
        options: ['1', '2']
permissions:
  contents: read
concurrency:
  group: full-collector-comparison
  cancel-in-progress: false
jobs:
  compare:
    if: github.repository == 'leomanchic/hangingout-collector'
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(inputs.source == 'kudago' && '["kudago"]' || inputs.source == 'yandex' && '["yandex"]' || '["kudago","yandex"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-probe.txt
      - run: python -m pip install -r requirements-probe.txt
      - run: python -m unittest discover -s tests
      - run: python -m playwright install --with-deps chromium
      - run: python -m patchright install chromium
      - name: Paired full-budget dry runs
        env:
          BENCHMARK_SOURCE: ${{ matrix.source }}
          BENCHMARK_ROUNDS: ${{ inputs.rounds }}
        run: python benchmark_collector.py --source "$BENCHMARK_SOURCE" --rounds "$BENCHMARK_ROUNDS"
      - name: Save comparison and public schedule fingerprints
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-comparison-${{ matrix.source }}
          path: artifacts/full-benchmark/${{ matrix.source }}/*.json
          retention-days: 7
          if-no-files-found: warn

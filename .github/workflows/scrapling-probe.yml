name: Scrapling read-only probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scrapling-probe
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'leomanchic/hangingout-collector'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-probe.txt
      - name: Install isolated probe dependencies
        run: python -m pip install -r requirements-probe.txt
      - name: Check collector contracts
        run: python -m unittest discover -s tests
      - name: Install probe Chromium
        run: python -m patchright install --with-deps chromium
      - name: Fetch public sample without publishing
        # No ingestion key, saved browser state or user data is supplied.
        run: python probe_scrapling.py
